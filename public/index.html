<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>동물 광클 레이스 🏁</title><style>
:root{font-family:system-ui,-apple-system,'Malgun Gothic',sans-serif;color:#172a35;background:#f1f8ff}*{box-sizing:border-box}body{margin:0}main{max-width:650px;margin:auto;padding:20px 16px 60px}h1{text-align:center;font-size:30px;margin:16px 0 8px}h2{margin:8px 0 14px}.sub{text-align:center;color:#547084;margin-bottom:22px}.panel{background:white;border-radius:22px;padding:22px;margin:16px 0;box-shadow:0 8px 30px #274c7315}.hidden{display:none!important}input{font-size:19px;width:100%;padding:15px;border:2px solid #d9e5ee;border-radius:12px;margin:10px 0 18px}.animals{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.animal{border:2px solid #e2edf6;background:#fff;border-radius:15px;padding:9px 0;font-size:29px;cursor:pointer}.animal.active{border-color:#1977f3;background:#e5f1ff}button{cursor:pointer}button.primary{width:100%;padding:17px;border:0;border-radius:14px;background:#1479ee;color:white;font-weight:800;font-size:19px;margin-top:16px}button.primary:disabled{background:#a9bbc9}.hint{font-size:14px;color:#658095;line-height:1.6}.player{display:flex;align-items:center;gap:10px;padding:12px;border-bottom:1px solid #edf2f5}.player:last-child{border:0}.face{font-size:30px}.name{flex:1;font-weight:700;overflow:hidden;text-overflow:ellipsis}.ready{font-size:13px;color:#888}.ready.yes{color:#169461;font-weight:800}.status{text-align:center;font-weight:800;color:#1d65a3}.track{margin:12px 0;padding:8px 0}.trackHead{display:flex;gap:8px;align-items:center;font-size:14px;margin-bottom:5px}.trackLine{height:23px;background:repeating-linear-gradient(90deg,#e8eef2,#e8eef2 18px,#f8fafb 18px,#f8fafb 36px);border-radius:15px;overflow:hidden;position:relative}.bar{height:100%;background:linear-gradient(90deg,#7bd8ff,#2779ff);border-radius:15px;transition:width .09s linear}.pct{margin-left:auto;font-weight:700}#tap{width:100%;height:155px;border:0;border-radius:30px;background:linear-gradient(135deg,#ff8b2b,#ff4b54);color:white;font-size:34px;font-weight:900;box-shadow:0 9px 0 #c43739;touch-action:manipulation;user-select:none;-webkit-user-select:none}#tap:active{transform:translateY(4px);box-shadow:0 5px 0 #c43739}#tap:disabled{background:#b5bdc8;box-shadow:none}.podium{text-align:center;font-size:22px;line-height:2}.small{text-align:center;color:#627a8d;font-size:14px}#error{color:#c02f44;text-align:center;font-weight:700;min-height:20px}.pill{display:inline-block;background:#e8f3ff;padding:5px 12px;border-radius:50px;color:#176ab4;font-size:13px}
</style></head><body><main><h1>🏁 동물 광클 레이스</h1><p class="sub">친구들과 실시간 질주! 최대 10명 · 방번호 없음</p><div id="error"></div>
<section id="join" class="panel"><h2>게임 입장</h2><label for="nickname">닉네임</label><input id="nickname" maxlength="12" placeholder="닉네임을 입력하세요"><h3>동물 선택</h3><div id="animals" class="animals"></div><button id="joinBtn" class="primary">공용 대기실 입장</button><p class="hint">모두 같은 링크로 접속하면 같은 대기실에 모여요. 최소 2명이 있어야 출발합니다.</p></section>
<section id="lobby" class="panel hidden"><h2>🏠 공용 대기실 <span class="pill" id="count"></span></h2><div id="roster"></div><button id="readyBtn" class="primary">준비 완료!</button><button id="startBtn" class="primary" disabled>준비한 사람끼리 경기 시작 (최소 2명)</button><p class="hint">준비한 사람이 2명 이상이면 준비한 참가자 누구나 경기 시작을 누를 수 있어요. 준비하지 않은 사람은 이번 경기에서 제외돼요. 늦게 들어온 친구는 다음 경기에 참여할 수 있어요.</p></section>
<section id="race" class="panel hidden"><h2 id="raceTitle">🏃 달리기!</h2><div id="tracks"></div><button id="tap" disabled>준비 중...</button><p class="small">버튼을 빠르게 눌러 200번 터치해 먼저 완주하세요!</p></section>
<section id="end" class="panel hidden"><h2>🏆 시상식</h2><div id="podium" class="podium"></div><h3>전체 순위</h3><div id="ranking"></div><button id="again" class="primary">🔄 다시하기 (모두 대기실로)</button></section>
<p id="connection" class="small">서버에 연결하는 중...</p></main><script>
const $=id=>document.getElementById(id), animals=['🐰','🐶','🐱','🦊','🐼','🐯','🐸','🐻','🐹','🐧'];let selected='🐰',myId=null,state=null,ws=null,joined=false;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function choose(a){selected=a;document.querySelectorAll('.animal').forEach(b=>b.classList.toggle('active',b.textContent===a));}
$('animals').innerHTML=animals.map(a=>`<button class="animal ${a===selected?'active':''}" data-a="${a}">${a}</button>`).join('');$('animals').onclick=e=>{const a=e.target.dataset.a;if(a)choose(a);};
function send(o){if(ws?.readyState===1)ws.send(JSON.stringify(o));}
function connect(){ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);ws.onopen=()=>{$('connection').textContent='🟢 실시간 서버 연결됨';$('error').textContent='';if(joined){joined=false;myId=null;$('error').textContent='연결이 끊겨 다시 접속했어요. 닉네임으로 재입장해 주세요.';show('join');}};ws.onclose=()=>{$('connection').textContent='🔴 연결 끊김 · 재연결 중';setTimeout(connect,2500);};ws.onmessage=e=>{let m=JSON.parse(e.data);if(m.type==='error'){$('error').textContent=m.message;return;}if(m.type==='joined'){myId=m.id;joined=true;$('error').textContent='';}if(m.type==='state'){state=m;render();}};}
function show(id){for(const s of ['join','lobby','race','end'])$(s).classList.toggle('hidden',s!==id);}
$('joinBtn').onclick=()=>{if(!ws||ws.readyState!==1){$('error').textContent='서버 연결을 기다려 주세요.';return;}const name=$('nickname').value.trim();if(!name){$('error').textContent='닉네임을 입력해 주세요.';return;}send({type:'join',name,animal:selected});};
$('startBtn').onclick=()=>send({type:'start'});
$('readyBtn').onclick=()=>{const me=state?.players.find(p=>p.id===myId);if(me)send({type:'ready',ready:!me.ready});};
$('tap').addEventListener('pointerdown',e=>{e.preventDefault();send({type:'tap'});});
$('again').onclick=()=>send({type:'again'});
function render(){if(!state)return;if(!joined||!myId){show('join');return;}const me=state.players.find(p=>p.id===myId);if(!me){joined=false;myId=null;show('join');return;}
if(state.phase==='lobby'){show('lobby');$('count').textContent=`${state.players.length}/${state.max}명`;$('roster').innerHTML=state.players.map(p=>`<div class="player"><span class="face">${p.animal}</span><span class="name">${esc(p.name)}${p.id===myId?' (나)':''}</span><span class="ready ${p.ready?'yes':''}">${p.ready?'✓ 준비 완료':'대기 중'}</span></div>`).join('');$('readyBtn').textContent=me.ready?'준비 취소':'준비 완료!';$('startBtn').disabled=!(me.ready&&state.players.filter(p=>p.ready).length>=2);}
if(state.phase==='countdown'||state.phase==='racing'){show('race');const countdown=Math.max(1,Math.ceil((state.countdownAt-Date.now())/1000));$('raceTitle').textContent=state.phase==='countdown'?`⏱️ ${countdown}초 후 출발!`:'🏃 결승선을 향해 달려!';$('tap').disabled=state.phase!=='racing'||!me.active||!!me.place;$('tap').textContent=state.phase==='countdown'?'곧 출발!':!me.active?'👀 관전 중':me.place?'🏁 완주!':'🔥 광클! 광클!';$('tracks').innerHTML=state.players.filter(p=>p.active).sort((a,b)=>b.progress-a.progress).map(p=>`<div class="track"><div class="trackHead"><span>${p.animal} ${esc(p.name)}${p.id===myId?' (나)':''}</span><span class="pct">${p.progress}/${state.goal}회 ${p.place?'🏁':''}</span></div><div class="trackLine"><div class="bar" style="width:${Math.min(100,p.progress/state.goal*100)}%"></div></div></div>`).join('');}
if(state.phase==='results'){show('end');const r=state.results;$('podium').innerHTML=r.slice(0,3).map((p,i)=>`${['🥇','🥈','🥉'][i]} ${p.animal} ${esc(p.name)}<br>`).join('')||'참가자 없음';$('ranking').innerHTML=r.map(p=>`<div class="player"><b>${p.place}위</b><span class="face">${p.animal}</span><span class="name">${esc(p.name)}</span><span>${p.progress}/${state.goal}회</span></div>`).join('');}}
setInterval(()=>{if(state?.phase==='countdown'&&joined) $('raceTitle').textContent=`⏱️ ${Math.max(1,Math.ceil((state.countdownAt-Date.now())/1000))}초 후 출발!`;},200);connect();
</script></body></html>
